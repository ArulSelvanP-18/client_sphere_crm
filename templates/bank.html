<!DOCTYPE html>
<html>
<head>
    <title>Bank App</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Animation -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

</head>

<body class="container mt-5">

<h2 class="text-center mb-4">
    <i class="fa-solid fa-building-columns"></i> Bank Management System
</h2>

{% if message %}
<div class="alert alert-success text-center" data-aos="zoom-in">
    {{ message }}
</div>
{% endif %}

<div class="row">

<!-- CREATE -->
<div class="col-md-6" data-aos="fade-right">
<div class="card p-3 mb-4">
<h4><i class="fa-solid fa-user-plus"></i> Create Account</h4>
<form method="post">
{% csrf_token %}
<input type="hidden" name="action" value="create">
<input class="form-control mb-2" name="name" placeholder="Name">
<input class="form-control mb-2" name="balance" type="number" placeholder="Balance">
<button class="btn btn-primary">Create</button>
</form>
</div>
</div>

<!-- DEPOSIT -->
<div class="col-md-6" data-aos="fade-left">
<div class="card p-3 mb-4">
<h4><i class="fa-solid fa-money-bill-wave"></i> Deposit</h4>
<form method="post">
{% csrf_token %}
<input type="hidden" name="action" value="deposit">
<input class="form-control mb-2" name="id" type="number" placeholder="Account ID">
<input class="form-control mb-2" name="amount" type="number" placeholder="Amount">
<button class="btn btn-success">Deposit</button>
</form>
</div>
</div>

<!-- WITHDRAW -->
<div class="col-md-6" data-aos="fade-up">
<div class="card p-3 mb-4">
<h4><i class="fa-solid fa-money-bill-transfer"></i> Withdraw</h4>
<form method="post">
{% csrf_token %}
<input type="hidden" name="action" value="withdraw">
<input class="form-control mb-2" name="id" type="number" placeholder="Account ID">
<input class="form-control mb-2" name="amount" type="number" placeholder="Amount">
<button class="btn btn-danger">Withdraw</button>
</form>
</div>
</div>

<!-- BALANCE -->
<div class="col-md-6" data-aos="fade-up">
<div class="card p-3 mb-4">
<h4><i class="fa-solid fa-wallet"></i> Check Balance</h4>
<form method="post">
{% csrf_token %}
<input type="hidden" name="action" value="balance">
<input class="form-control mb-2" name="id" type="number" placeholder="Account ID">
<button class="btn btn-info">Check</button>
</form>
</div>
</div>

</div>

<!-- Animation Script -->
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
AOS.init();
</script>

</body>
</html>
